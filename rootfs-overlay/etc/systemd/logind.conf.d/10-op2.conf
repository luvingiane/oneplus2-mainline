# ztMETRO handles the power key: a short press turns the screen off/on,
# holding it ~0.8 s opens its power menu (power off / restart / fastboot /
# recovery). logind must not act on it, or a long press powers off at once.
[Login]
HandlePowerKey=ignore
HandlePowerKeyLongPress=ignore
HandleSuspendKey=ignore
HandleLidSwitch=ignore
