# OnePlus 2: the sensors are behind the ADSP sensor core, not on the Galaxy S9's hub (tools/op2-sensord)
[Unit]
Description=ztoscsf-sensord: light and motion sensors of the OnePlus 2 (ADSP sensor core)
Requires=
After=
After=op2-adsp.service op2-sns-reg.service
Wants=op2-sns-reg.service

[Service]
ExecStartPre=
ExecStart=
ExecStart=/usr/local/bin/op2-sensord
