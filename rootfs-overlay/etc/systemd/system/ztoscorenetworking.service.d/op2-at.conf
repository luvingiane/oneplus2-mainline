[Unit]
After=op2-modem.service

[Service]
Environment=ZTOS_MODEM_AT=/dev/wwan0at0
# the call log and the messages live here (the daemon does not create it)
StateDirectory=ztoscorenetworking
StateDirectoryMode=0755
ExecStartPre=/bin/mkdir -p /var/lib/ztoscorenetworking/sms
ExecStartPre=/bin/chmod 0777 /var/lib/ztoscorenetworking /var/lib/ztoscorenetworking/sms
