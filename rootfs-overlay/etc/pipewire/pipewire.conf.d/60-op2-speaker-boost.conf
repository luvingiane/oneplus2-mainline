# OnePlus 2 loudspeaker: the TFA9890 is used without its DSP (no volume, no protection) and speech is
# mastered quiet. A lookahead limiter with 0 dB input gain (the S16 path is already loud) makes it loud and keeps the peaks at -2 dB.
# Measured: a clean -1 dBFS tone is ~23 dB louder than speaker-test, harmonics < -50 dB.
context.modules = [
  { name = libpipewire-module-filter-chain
    args = {
      node.description = "Loudspeaker"
      media.name       = "Loudspeaker"
      filter.graph = {
        nodes = [
          { type = ladspa
            name = limiter
            plugin = fast_lookahead_limiter_1913
            label = fastLookaheadLimiter
            control = { "Input gain (dB)" = 0.0 "Limit (dB)" = -3.0 "Release time (s)" = 0.4 }
          }
        ]
        inputs  = [ "limiter:Input 1" "limiter:Input 2" ]
        outputs = [ "limiter:Output 1" "limiter:Output 2" ]
      }
      audio.channels = 2
      audio.position = [ FL FR ]
      capture.props = {
        node.name = "op2_speaker_boost"
        media.class = Audio/Sink
        priority.session = 2000
        priority.driver = 2000
      }
      playback.props = {
        node.name = "op2_speaker_boost_out"
        node.passive = true
        target.object = "alsa_output.platform-sound.HiFi__Speaker__sink"
      }
    }
  }
]
