# The OnePlus 2 has ONE loudspeaker, fed by one TFA9890 that reads only the LEFT slot of the I2S frame (tfa989x CHSA = left,
# no hardware mix): a stereo stream played as FL/FR lost its right channel. Make the sink mono, so PipeWire mixes left and
# right into the one channel the amplifier plays.
monitor.alsa.rules = [
  {
    matches = [ { node.name = "~alsa_output.platform-sound.*Speaker*" } ]
    actions = { update-props = { audio.channels = 1, audio.position = [ MONO ] } }
  }
]
