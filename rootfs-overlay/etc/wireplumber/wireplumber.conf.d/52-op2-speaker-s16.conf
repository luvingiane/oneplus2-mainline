# The ADSP/TFA9890 path is ~40 dB quieter with 24/32-bit samples than with 16-bit ones (measured:
# the same -12 dBFS tone, S16 direct 78.9 dB, S24 via PipeWire 36 dB, S32 6.6 dB): force S16.
monitor.alsa.rules = [
  {
    matches = [ { node.name = "~alsa_output.platform-sound.*" } ]
    actions = { update-props = { audio.format = "S16LE" } }
  }
]
