[General]
# Paging timeout in units of 0.625 ms (bluez src/main.c option table,
# range 0x0001-0xFFFF). 16384 = 10.24 s; default unset = controller
# default 0x2000 = 5.12 s, too tight when Wi-Fi scans share the QCA6174.
PageTimeout=16384
# If the peer re-pairs with JustWorks (it lost its bond), ask once
# instead of failing. Default is "never".
JustWorksRepairing=confirm
# How long to stay pairable. 0 = forever (the phone is a remote control).
PairableTimeout=0

[Policy]
# Power on every controller when found (default true since 5.5x; set it).
AutoEnable=true
# Reconnect after link loss for audio/handsfree profiles.
ReconnectUUIDs=0000110b-0000-1000-8000-00805f9b34fb,0000110e-0000-1000-8000-00805f9b34fb,0000111e-0000-1000-8000-00805f9b34fb,0000110a-0000-1000-8000-00805f9b34fb,00001108-0000-1000-8000-00805f9b34fb,00001112-0000-1000-8000-00805f9b34fb
ReconnectAttempts=7
ReconnectIntervals=1,2,4,8,16,32,64
